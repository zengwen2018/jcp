# 韭菜盘（JCP）Nginx 反向代理配置
#
# 关键点：SSE 长连接必须关闭缓冲、延长超时，否则实时行情事件会被攒住批量下发。

upstream jcp_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name jcp.example.com;

    # 强制 HTTPS（配置好证书后启用）。
    # return 301 https://$host$request_uri;

    # 访问日志。
    access_log /var/log/nginx/jcp.access.log;
    error_log  /var/log/nginx/jcp.error.log;

    # 上传体积限制（配置导入等场景）。
    client_max_body_size 10m;

    # ---------- SSE 事件流 ----------
    location /api/events {
        proxy_pass http://jcp_backend;
        proxy_http_version 1.1;

        # SSE 必须关闭缓冲，否则事件不会实时到达。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # 长连接超时设置。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 关闭 Connection 头改写，保持长连接。
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 订阅接口 ----------
    location /api/market/ {
        proxy_pass http://jcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---------- 普通 API ----------
    location /api/ {
        proxy_pass http://jcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 会议请求可能耗时较长。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 前端静态资源 ----------
    location / {
        proxy_pass http://jcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://jcp_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

